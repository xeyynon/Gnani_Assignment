<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SHOP}}: orders and credit</title>
<style>
  /* Layout concept: what the shopkeeper needs at a glance first (four numbers), then the live list of orders,
     with the credit book and loan enquiries beside it. Status is carried by a coloured pill, not by words alone. */
  :root{--bg:#F5F6FB;--surface:#fff;--surface2:#ECEEF8;--ink:#14173A;--muted:#575C82;--line:#D9DCEE;
    --indigo:#3A3FC8;--indigo-soft:#E4E5FB;--teal:#0B7F6F;--teal-soft:#D8F1EC;
    --turmeric:#C98400;--turmeric-soft:#FBEFCF;--turmeric-ink:#7A4E00;--warn:#C43D27;--warn-soft:#FBE3DE}
  @media (prefers-color-scheme:dark){:root{--bg:#0F1226;--surface:#171B38;--surface2:#20254A;--ink:#ECEEFB;--muted:#A0A6CE;--line:#2C3262;
    --indigo:#9396FF;--indigo-soft:#262B5E;--teal:#3FD0B8;--teal-soft:#123A3A;
    --turmeric:#F2B53A;--turmeric-soft:#3A2E12;--turmeric-ink:#F2C56A;--warn:#FF8068;--warn-soft:#431E1B}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    padding:20px max(16px,env(safe-area-inset-left,0px)) 56px}
  .wrap{max-width:1100px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
  h1{font-size:clamp(24px,4vw,32px);margin:0;letter-spacing:-.01em}
  h2{font-size:18px;margin:0 0 12px}
  .live{font-size:13px;color:var(--muted)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--teal);margin-right:6px}
  .dot.off{background:var(--warn)}
  .banner{margin-top:14px;padding:9px 13px;border-radius:8px;font-size:14px;background:var(--turmeric-soft);border:1px solid var(--turmeric);color:var(--turmeric-ink)}
  .banner.bad{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-top:18px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
  .tile .k{font-size:13px;color:var(--muted)}
  .tile .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .tile .s{font-size:13px;color:var(--muted)}
  .tile.attn .v{color:var(--warn)}
  .cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;margin-top:26px;align-items:start}
  @media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
  .stack{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
  .card.fresh{border-color:var(--indigo);box-shadow:0 0 0 2px var(--indigo-soft)}
  .row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
  .who{font-weight:600}
  .when,.muted{font-size:13px;color:var(--muted)}
  .total{font-weight:700;font-variant-numeric:tabular-nums}
  .pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .pill.confirmed{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
  .pill.credit_pending{background:var(--turmeric-soft);border-color:var(--turmeric);color:var(--turmeric-ink)}
  .pill.incomplete{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
  .pill.pay{background:var(--surface2);color:var(--muted)}
  details>summary{cursor:pointer;list-style:none}
  details>summary::-webkit-details-marker{display:none}
  details[open]>summary{margin-bottom:8px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  td,th{padding:4px 0;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:var(--teal)}
  .bar.high>i{background:var(--warn)}
  .empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}
  .tag{font-size:12px;color:var(--muted);border:1px dashed var(--muted);border-radius:999px;padding:1px 8px}
  button{font:600 14px system-ui,sans-serif;padding:6px 14px;border-radius:8px;border:1px solid var(--indigo);background:var(--indigo);color:#fff;cursor:pointer}
  summary:focus-visible,button:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
  @media (prefers-reduced-motion:no-preference){.card{transition:border-color .3s,box-shadow .3s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">{{SHOP}}</h1>
    <div class="live"><span class="dot" id="dot"></span><span id="updated">Loading...</span></div>
  </header>
  <div id="notices"></div>
  <section class="tiles" id="tiles" aria-label="Today at a glance"></section>
  <div class="cols">
    <section aria-labelledby="h-orders"><h2 id="h-orders">Orders</h2><div class="stack" id="orders"></div></section>
    <div class="stack" style="gap:26px">
      <section aria-labelledby="h-ledger"><h2 id="h-ledger">Credit book (udhaar)</h2><div class="stack" id="ledger"></div></section>
      <section aria-labelledby="h-loans"><h2 id="h-loans">Loan enquiries</h2><div class="stack" id="loans"></div></section>
    </div>
  </div>
</div>

<script>
'use strict';
/* ---- helpers (pure; tested in Node) ---- */
const nf = new Intl.NumberFormat('en-IN');
function rupees(n) { return '₹' + nf.format(Math.round(Number(n) || 0)); }
function itemsSummary(items, max) {
  max = max || 3;
  const parts = (items || []).slice(0, max).map(i => (i.qty != null ? i.qty + (i.unit ? ' ' + i.unit : '') + ' ' : '') + i.name);
  const more = (items || []).length - max;
  return parts.join(', ') + (more > 0 ? ' +' + more + ' more' : '');
}
function relTime(iso, now) {
  const t = new Date(iso), n = now || new Date();
  if (isNaN(t)) return '';
  const mins = Math.round((n - t) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const clock = t.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  if (t.toDateString() === n.toDateString()) return Math.round(mins / 60) + ' h ago, ' + clock;
  const y = new Date(n); y.setDate(n.getDate() - 1);
  if (t.toDateString() === y.toDateString()) return 'yesterday ' + clock;
  return t.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ' ' + clock;
}
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso) {                       // 'YYYY-MM-DD' -> '28 Oct', without any time-zone shift
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? Number(m[3]) + ' ' + MONTHS[Number(m[2]) - 1] : '';
}
function limitUsed(balance, limit) { return limit > 0 ? Math.max(0, Math.min(1, balance / limit)) : 0; }
const STATUS = { confirmed: 'Confirmed', credit_pending: 'Credit pending', incomplete: 'Incomplete' };
function statusLabel(s) { return STATUS[s] || 'Confirmed'; }
function paymentLabel(p) { return { cash: 'Cash', upi: 'UPI', udhaar: 'On credit' }[p] || (p || ''); }
/* ---- end helpers ---- */

/* Everything below builds the page from text nodes, never from HTML strings: order data
   contains text a caller chose (names, items), and must not be able to inject markup. */
function h(tag, attrs) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  for (let i = 2; i < arguments.length; i++) {
    const c = arguments[i];
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}
const $ = id => document.getElementById(id);
const seen = new Set(), freshUntil = {}; let firstLoad = true, lastOk = 0, signedOut = false, failed = false;

function tile(key, value, sub, cls) {
  return h('div', { class: 'tile' + (cls ? ' ' + cls : '') }, h('div', { class: 'k', text: key }), h('div', { class: 'v', text: value }), sub ? h('div', { class: 's', text: sub }) : null);
}
function renderTiles(s) {
  $('tiles').replaceChildren(
    tile('Orders today', String(s.orders_today), s.orders_total + ' in all'),
    tile('Sales today', rupees(s.sales_today), 'not counting incomplete orders'),
    tile('Owed on credit', rupees(s.udhaar_outstanding), s.customers_owing + (s.customers_owing === 1 ? ' customer' : ' customers')),
    tile('Needs you', String(s.needs_attention), s.needs_attention ? 'credit pending or incomplete' : 'nothing waiting', s.needs_attention ? 'attn' : ''));
}
function orderCard(o) {
  const detail = h('div', null,
    h('table', null, h('tbody', null, ...o.items.map(i => h('tr', null,
      h('td', { text: i.name }), h('td', { text: i.qty != null ? i.qty + (i.unit ? ' ' + i.unit : '') : '' }), h('td', { class: 'num', text: rupees(i.line_total) }))))),
    o.payment === 'udhaar' && o.balance_after != null ? h('p', { class: 'muted', text: 'Credit balance ' + rupees(o.balance_before) + ' → ' + rupees(o.balance_after) }) : null,
    o.delivery ? h('p', { class: 'muted', text: 'Delivery: ' + o.delivery }) : null);
  const summary = h('summary', null,
    h('div', { class: 'row' }, h('span', { class: 'who', text: o.customer || 'Walk-in caller' }), h('span', { class: 'pill ' + o.status, text: statusLabel(o.status) })),
    h('div', { text: itemsSummary(o.items) }),
    h('div', { class: 'row' }, h('span', { class: 'when', text: relTime(o.time) }),
      h('span', null, h('span', { class: 'pill pay', text: paymentLabel(o.payment) }), ' ', h('span', { class: 'total', text: rupees(o.total) }))));
  return h('div', { class: 'card' + ((freshUntil[o.id] || 0) > Date.now() ? ' fresh' : '') }, h('details', null, summary, detail));
}
function ledgerRow(c) {
  const used = limitUsed(c.balance, c.credit_limit);
  const extra = c.promise_date ? 'Promised ' + fmtDate(c.promise_date) : (c.last_purchase ? 'Last bought ' + fmtDate(c.last_purchase) : '');
  return h('div', { class: 'card' },
    h('div', { class: 'row' }, h('span', { class: 'who', text: c.name }), h('span', { class: 'total', text: rupees(c.balance) })),
    h('div', { class: 'bar' + (used >= 0.9 ? ' high' : '') }, h('i', { style: 'width:' + Math.round(used * 100) + '%' })),
    h('div', { class: 'row' }, h('span', { class: 'muted', text: 'limit ' + rupees(c.credit_limit) }), h('span', { class: 'muted', text: extra })));
}
function loanCard(l) {
  const body = l.covered === false
    ? h('p', { class: 'muted', text: 'Project cost ' + rupees(l.project_cost) + ' is above ₹50 lakh, so no scheme applies.' })
    : h('div', null,
        h('div', { text: rupees(l.margin_money) + ' margin → ' + rupees(l.project_cost) + ' project → ' + rupees(l.loan_amount) + ' loan' }),
        h('div', { class: 'muted', text: l.scheme + ', ' + l.annual_rate_pct + '% a year' }),
        h('div', { class: 'total', text: rupees(l.monthly_instalment) + ' × ' + l.repayment_months + ' months' }),
        h('div', { class: 'muted', text: 'after a ' + l.moratorium_months + '-month moratorium' }));
  return h('div', { class: 'card' },
    h('div', { class: 'row' }, h('span', { class: 'who', text: [l.business, l.place].filter(Boolean).join(', ') || 'Loan enquiry' }), h('span', { class: 'tag', text: 'indicative' })),
    body, h('div', { class: 'when', text: relTime(l.time) }));
}
function fill(id, items, make, emptyText) {
  $(id).replaceChildren(...(items.length ? items.map(make) : [h('div', { class: 'empty', text: emptyText })]));
}
function render(d) {
  document.title = d.title + ': orders and credit';
  $('title').textContent = d.title;
  d.orders.forEach(o => { if (!seen.has(o.id)) { seen.add(o.id); if (!firstLoad) freshUntil[o.id] = Date.now() + 8000; } });
  renderTiles(d.summary);
  fill('orders', d.orders, orderCard, 'No orders yet. They appear here within seconds of a call ending.');
  fill('ledger', d.ledger, ledgerRow, 'Nobody owes anything yet.');
  fill('loans', d.loans, loanCard, 'No loan enquiries yet.');
  const notes = [];
  if ([...d.orders, ...d.loans].some(r => r.synthetic)) notes.push(h('div', { class: 'banner', text: 'This shows made-up demo data.' }));
  d.problems.forEach(p => notes.push(h('div', { class: 'banner bad', text: p })));
  $('notices').replaceChildren(...notes);
  firstLoad = false;
}
function tick() {
  const el = $('updated'), dot = $('dot');
  if (signedOut) return;
  if (!lastOk) { el.textContent = failed ? 'Could not load the data yet. Retrying...' : 'Loading...'; dot.className = 'dot' + (failed ? ' off' : ''); return; }
  const s = Math.round((Date.now() - lastOk) / 1000);
  const stale = s > 10;
  dot.className = 'dot' + (stale ? ' off' : '');
  el.textContent = stale ? 'Connection lost. Showing data from ' + s + ' s ago.' : 'Live, updated ' + (s < 2 ? 'just now' : s + ' s ago');
}
async function poll() {
  try {
    const r = await fetch(location.origin + location.pathname.replace(/\/$/, '') + '/data', { cache: 'no-store', credentials: 'same-origin' });
    if (r.status === 401 || r.status === 429) {
      signedOut = true;
      $('updated').textContent = r.status === 401 ? 'Signed out.' : 'Too many wrong attempts. Try again in a minute.';
      $('dot').className = 'dot off';
      $('notices').replaceChildren(h('div', { class: 'banner bad' }, 'Sign in again to see this shop. ', h('button', { type: 'button', id: 'reload', text: 'Sign in' })));
      $('reload').addEventListener('click', () => location.reload());
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    try {
      render(data);
      lastOk = Date.now();
      failed = false;
    } catch (e) {                                   // a bug in drawing the data: say so, don't sit on "Loading..."
      console.error(e);
      $('notices').replaceChildren(h('div', { class: 'banner bad', text: 'The page could not show this data (' + e.message + ').' }));
    }
  } catch (e) { failed = true; /* a network problem: keep the last data; tick() shows the connection warning */ }
  tick();
  setTimeout(poll, 3000);
}
setInterval(tick, 1000);
poll();
</script>
</body>
</html>
