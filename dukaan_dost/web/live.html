/* ---- the data: the dashboard's own feed, asked every second while a call is on and every 3 seconds otherwise ---- */
function render(d) {
  document.querySelector('main').removeAttribute('aria-busy');
  document.title = d.title + ': live call';
  $('title').textContent = d.title;
  drawLive(Array.isArray(d.live) ? d.live : []);
}

{{include:shared/poll.js}}

{{include:shared/theme.js}}
const here = location.pathname.replace(/\/+$/, '');
$('todash').setAttribute('href', here.replace(/\/live$/, '/dashboard'));
setInterval(tick, 1000);
poll(location.origin + here.replace(/\/live$/, '/dashboard/data'), render, liveDelay);
