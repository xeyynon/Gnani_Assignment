<script>
'use strict';

{{include:call/audio-capture.js}}

/* ---- helpers (pure; tested in Node) ---- */
{{include:shared/format.js}}
{{include:shared/keys.js}}
{{include:shared/theme-helpers.js}}
{{include:call/helpers.js}}
{{include:shared/loan-view.js}}
/* ---- end helpers ---- */

{{include:shared/dom.js}}

const COPY = {
  idle:       ['Ready when you are', 'Press Start call and talk the way you would at the counter.', 'Idle'],
  connecting: ['Connecting...', 'Setting up the line.', 'Connecting...'],
  listening:  ['Dukaan Dost is on the call', 'Go ahead, tell me what you need.', 'Listening...'],
  thinking:   ['One moment...', 'Working on your request.', 'Thinking...'],
  speaking:   ['Dukaan Dost is speaking', 'You can talk over it at any time.', 'Speaking...'],
  muted:      ['You are on mute', 'Press the microphone button to talk again.', 'Muted'],
  ended:      ['Call ended', 'Press Start call to try again.', 'Idle']
};

const SEND_SAMPLES = 480;            // 30 ms at 16 kHz
const BARS = 37, THINK_LIMIT_MS = 12000;
let ws = null, ctx = null, stream = null, analyser = null, ready = false, gen = 0, inCall = false, muted = false;
let pending = [], pendingLen = 0, playChain = Promise.resolve(), current = null, queued = 0;
let state = 'idle', notice = null, micLevel = 0, shownLevel = 0, thinkTimer = null, clockTimer = null, callStart = 0;

/* ---- what the call card shows ---- */
function view() { return inCall && muted && state === 'listening' ? 'muted' : state; }
function render() {
  const v = view(), c = COPY[v];
  $('callcard').dataset.view = v;
  $('title').textContent = c[0];
  const s = $('status'); s.textContent = notice ? notice.text : c[1]; s.className = notice && notice.bad ? 'bad' : '';
  $('speaking').textContent = c[2];
  const on = inCall && state !== 'connecting';
  $('callchip').className = 'chip' + (on ? ' on' : '');
  $('calltext').textContent = on ? 'Call in progress' : (state === 'connecting' ? 'Connecting...' : 'Not on a call');
  $('timer').hidden = !on;
  $('start').parentNode.hidden = inCall; $('hangwrap').hidden = !inCall;
  $('mutewrap').hidden = !inCall;
}
function setState(s) {
  state = s; notice = null;
  clearTimeout(thinkTimer);
  if (s === 'thinking') {
    thinkTimer = setTimeout(() => { if (state === 'thinking') setState('listening'); }, THINK_LIMIT_MS);   // not every turn gets a spoken reply
    showThinking(true);
  } else showThinking(false);
  render();
}
function focusIfLost(el) { const a = document.activeElement; if (!a || a === document.body) el.focus(); }   // never leave focus on the page body
function say(text, bad) { notice = { text, bad: !!bad }; render(); }

{{include:call/transcript.js}}

{{include:call/order-panel.js}}

{{include:call/loan-panel.js}}

function resetScreen() {
  resetTranscript();
  resetOrder();
  resetLoan();
  $('langtext').textContent = 'Language: detected as you speak';
}

/* ---- the line ---- */
function sendAudio(pcm) {
  pending.push(pcm); pendingLen += pcm.length;
  if (pendingLen < SEND_SAMPLES) return;
  const joined = new Int16Array(pendingLen); let o = 0;
  for (const p of pending) { joined.set(p, o); o += p.length; }
  pending = []; pendingLen = 0;
  let sum = 0; for (let i = 0; i < joined.length; i++) sum += joined[i] * joined[i];
  micLevel = muted ? 0 : Math.min(1, Math.sqrt(sum / joined.length) / 32768 * 9);
  if (!muted && ready && ws && ws.readyState === WebSocket.OPEN) ws.send(joined.buffer);
}

function ack(id) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'played', id })); }

async function playOne(id, wav, myGen) {
  if (myGen !== gen || !ctx) { ack(id); return; }
  try {
    const buf = await ctx.decodeAudioData(wav);
    if (myGen !== gen) { ack(id); return; }
    await new Promise(done => {
      const src = ctx.createBufferSource();
      src.buffer = buf; src.connect(analyser);
      current = src;
      src.onended = () => { if (current === src) current = null; done(); };
      if (inCall && state !== 'speaking') setState('speaking');
      src.start();
    });
  } catch (e) { console.error('playback failed', e); }
  ack(id);
  if (myGen === gen && --queued <= 0) { queued = 0; if (state === 'speaking') setState('listening'); }
}

function stopPlayback() {
  gen++; queued = 0;                       // clips skipped because of this stop never count themselves down
  if (current) { try { current.stop(); } catch (e) {} }
  if (state === 'speaking') setState('listening');
}

function onMessage(ev) {
  if (typeof ev.data === 'string') {
    const m = JSON.parse(ev.data);
    if (m.type === 'ready') {
      ready = true; callStart = Date.now(); setState('listening');
      clearInterval(clockTimer); clockTimer = setInterval(() => { $('timer').textContent = clock((Date.now() - callStart) / 1000); }, 500);
    }
    else if (m.type === 'busy') { endCall(); say('Another call is already in progress. Try again in a moment.', true); }
    else if (m.type === 'stop') { stopPlayback(); if (lastAgent) lastAgent.classList.add('cut'); }
    else if (m.type === 'user') {
      showThinking(false);
      addMsg('user', m.text);
      const l = langName(m.lang); if (l) $('langtext').textContent = 'Language: ' + l;
      setState('thinking');
    }
    else if (m.type === 'agent') { showThinking(false); agentSaid(m.reply, m.text); if (state === 'thinking') { clearTimeout(thinkTimer); } }
    else if (m.type === 'order') renderOrder(m);
    else if (m.type === 'loan') renderLoan(m);
    return;
  }
  const id = new DataView(ev.data).getUint32(0);
  const wav = ev.data.slice(4);
  queued++;
  const myGen = gen;
  playChain = playChain.then(() => playOne(id, wav, myGen));
}

async function startCall() {
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    say('The microphone needs a secure page. Open this from localhost or an https link.', true);
    return;
  }
  inCall = true; muted = false; resetScreen(); setMuteView();
  setState('connecting'); focusIfLost($('hang'));
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    analyser = ctx.createAnalyser(); analyser.fftSize = 512; analyser.connect(ctx.destination);
    const url = URL.createObjectURL(new Blob([workletSource], { type: 'application/javascript' }));
    await ctx.audioWorklet.addModule(url);
    const source = ctx.createMediaStreamSource(stream);
    const node = new AudioWorkletNode(ctx, 'capture');
    const silent = ctx.createGain(); silent.gain.value = 0;     // keeps the graph running without playing the mic back
    source.connect(node); node.connect(silent); silent.connect(ctx.destination);
    node.port.onmessage = e => sendAudio(e.data);

    const base = location.pathname.replace(/index\.html$/, '').replace(/\/?$/, '/');   // /s/<shop>/ or /
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + base + 'ws');
    ws.binaryType = 'arraybuffer';
    ws.onmessage = onMessage;
    ws.onclose = () => { const was = ready; endCall(); if (!was) say('Could not reach the agent. Is it running?', true); };
    ws.onerror = () => say('Could not reach the agent. Is it running?', true);
  } catch (e) {
    console.error(e);
    endCall();
    say(e && e.name === 'NotAllowedError' ? 'Microphone permission was denied. Allow it in the address bar and try again.' : 'Could not start the call: ' + (e && e.message), true);
  }
}

function endCall() {
  const wasIn = inCall;
  inCall = false; ready = false; queued = 0; muted = false; micLevel = 0;
  gen++; if (current) { try { current.stop(); } catch (e) {} }
  clearInterval(clockTimer); clearTimeout(thinkTimer);
  if (ws) { const w = ws; ws = null; w.onclose = null; try { w.close(); } catch (e) {} }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (ctx) { ctx.close().catch(() => {}); ctx = null; analyser = null; }
  pending = []; pendingLen = 0;
  setMuteView();
  setState(wasIn ? 'ended' : 'idle'); focusIfLost($('start'));
}

function setMuteView() {
  $('mute').setAttribute('aria-pressed', String(muted));
  $('mute').setAttribute('aria-label', muted ? 'Unmute microphone' : 'Mute microphone');
  $('mute').title = muted ? 'Unmute (M)' : 'Mute (M)';
  $('mutelabel').textContent = muted ? 'Unmute (M)' : 'Mute (M)';
  $('muteicon').firstElementChild.setAttribute('href', muted ? '#i-mic-off' : '#i-mic');
}

{{include:call/waveform.js}}

document.addEventListener('keydown', e => { if (isPlainKey(e) && e.key.toLowerCase() === 'm' && inCall) $('mute').click(); });
$('start').addEventListener('click', startCall);
$('hang').addEventListener('click', endCall);
$('mute').addEventListener('click', () => { muted = !muted; if (muted) micLevel = 0; setMuteView(); render(); });
if (/^\/s\/[^/]+\/?$/.test(location.pathname)) $('dashlink').setAttribute('href', location.pathname.replace(/\/?$/, '/') + 'dashboard');
else $('dashlink').hidden = true;                    // the dashboards only exist under /s/<shop>/

{{include:shared/theme.js}}

render();
</script>
</body>
